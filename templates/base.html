<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Climb</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Background setup using a high-quality climbing image */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1522163182402-834f871fd851?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Modern Transparent Navbar */
        nav {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav h2 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Brand Color - Updated to Blue */
        nav h2 i {
            color: #3b82f6; 
        }

        /* Center main content area */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Navbar Links - New Additions */
        .nav-brand {
            text-decoration: none;
        }

    </style>
</head>
<body>
    
    <!-- Navigation Bar -->
    <nav>
        <a href="/search/" class="nav-brand">
            <h2><i class="fas fa-mountain"></i> Go Climb</h2>
        </a>
        
        <div class="nav-links">
            <a href="/search/" {% if '/search' in request.path %}class="active"{% endif %}><i class="fas fa-search"></i> Search</a>
            <a href="/map/" {% if '/map' in request.path %}class="active"{% endif %}><i class="fas fa-map"></i> Map</a>
            <a href="/forum/" {% if '/forum' in request.path %}class="active"{% endif %}><i class="fas fa-comments"></i> Community</a>
            {% if request.user.is_authenticated %}
                <a href="/favorites/" {% if '/favorites' in request.path %}class="active"{% endif %}><i class="fas fa-heart"></i> Favorites</a>
                <a href="/dashboard/" {% if '/dashboard' in request.path %}class="active"{% endif %}><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="/profile/" class="nav-user"><i class="fas fa-user-circle"></i> {{ request.user.username }}</a>
                <a href="#" id="nav-logout" class="nav-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            {% else %}
                <a href="/login/" {% if '/login' in request.path %}class="active"{% endif %}><i class="fas fa-sign-in-alt"></i> Login</a>
                <a href="/register/" {% if '/register' in request.path %}class="active"{% endif %}><i class="fas fa-user-plus"></i> Register</a>
            {% endif %}
        </div>
    </nav>

    <script>
        // Global logout via the auth API (session-based).
        document.addEventListener('click', function (e) {
            if (e.target.closest && e.target.closest('#nav-logout')) {
                e.preventDefault();
                fetch('/api/auth/logout/', { method: 'POST', credentials: 'include',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') } })
                  .finally(function () { window.location.href = '/search/'; });
            }
        });
        function getCookie(name) {
            var m = document.cookie.match('(^|; )' + name + '=([^;]*)');
            return m ? decodeURIComponent(m[2]) : null;
        }
    </script>

    <style>
        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: #3b82f6; }
        .nav-links a.nav-user { color: #fff; font-weight: 600; }
        .nav-links a.nav-logout { color: #f87171; }
        @media (max-width: 600px) {
            .nav-links { gap: 14px; }
            .nav-links a { font-size: 13px; }
        }
    </style>

    <!-- Content Area -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
