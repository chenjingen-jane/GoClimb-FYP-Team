{% extends 'base.html' %}

{% block content %}
<style>
    main { display: block !important; padding: 0 !important; }
    .fav-hero {
        background: linear-gradient(rgba(15,23,42,0.8), rgba(15,23,42,0.9));
        color: white; padding: 40px 20px;
    }
    .fav-hero h1 { max-width: 1200px; margin: 0 auto; font-size: 32px; font-weight: 600; }
    .fav-hero p { max-width: 1200px; margin: 6px auto 0; opacity: 0.8; }

    .fav-wrap { max-width: 1200px; margin: 36px auto; padding: 0 20px; }
    .fav-count { color: #475569; font-weight: 600; margin-bottom: 18px; }

    .crag-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px;
    }
    .crag-card {
        background: rgba(255,255,255,0.97); border-radius: 16px; padding: 25px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.12); transition: transform 0.3s ease;
        display: flex; flex-direction: column;
    }
    .crag-card:hover { transform: translateY(-5px); }
    .crag-card h4 { color: #1e293b; font-size: 22px; margin-bottom: 6px; }
    .crag-card .rock-type { color: #64748b; font-size: 14px; margin-bottom: 14px; }
    .crag-card .desc { color: #475569; font-size: 14px; line-height: 1.5; flex: 1; margin-bottom: 16px; }

    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .tag { background: #e2e8f0; color: #475569; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .tag.rock { background: #dbeafe; color: #1d4ed8; }

    .card-actions { display: flex; gap: 10px; }
    .view-btn {
        flex: 1; text-align: center; padding: 11px; background: transparent;
        color: #3b82f6; border: 2px solid #3b82f6; border-radius: 8px;
        text-decoration: none; font-weight: 600; transition: all 0.3s;
    }
    .view-btn:hover { background: #3b82f6; color: white; }
    .remove-btn {
        padding: 11px 14px; border-radius: 8px; border: 2px solid #ef4444;
        background: #fff; color: #ef4444; cursor: pointer; transition: all 0.3s;
    }
    .remove-btn:hover { background: #ef4444; color: #fff; }

    .empty-state {
        text-align: center; padding: 70px 20px; color: #64748b; font-size: 18px;
    }
    .empty-state a { color: #3b82f6; text-decoration: none; font-weight: 600; }
    .loading { text-align: center; padding: 40px; color: #94a3b8; }
</style>

<div class="fav-hero">
    <h1><i class="fas fa-heart" style="color:#ef4444;"></i> My Favorite Crags</h1>
    <p>Quick access to the climbing spots you saved.</p>
</div>

<div class="fav-wrap">
    <p class="fav-count" id="fav-count">Loading…</p>
    <div class="crag-grid" id="fav-grid">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
    </div>
</div>

<script>
    function getCookie(name) {
        var m = document.cookie.match('(^|; )' + name + '=([^;]*)');
        return m ? decodeURIComponent(m[2]) : null;
    }
    var ROCK_LABEL = {
        granite: 'Granite', sandstone: 'Sandstone', limestone: 'Limestone',
        boulder: 'Boulder', indoor: 'Indoor'
    };
    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
        });
    }
    function truncate(s, n) { s = s || ''; return s.length > n ? s.slice(0, n) + '…' : s; }

    function buildCard(crag) {
        var card = document.createElement('div');
        card.className = 'crag-card';
        card.innerHTML =
            '<h4>' + escapeHtml(crag.name) + '</h4>' +
            '<div class="rock-type"><i class="fas fa-mountain"></i> ' +
                (ROCK_LABEL[crag.rock_type] || crag.rock_type) + '</div>' +
            '<div class="desc">' + escapeHtml(truncate(crag.description, 110)) + '</div>' +
            '<div class="tags">' +
                '<span class="tag rock">' + (ROCK_LABEL[crag.rock_type] || crag.rock_type) + '</span>' +
                '<span class="tag">' + crag.difficulty_min + '–' + crag.difficulty_max + '</span>' +
                '<span class="tag"><i class="fas fa-route"></i> ' + crag.route_count + ' routes</span>' +
            '</div>' +
            '<div class="card-actions">' +
                '<a class="view-btn" href="/crag/' + crag.slug + '/">View Details</a>' +
                '<button class="remove-btn" data-crag="' + crag.id + '" title="Remove from favorites">' +
                    '<i class="fas fa-trash"></i></button>' +
            '</div>';
        return card;
    }

    function loadFavorites() {
        fetch('/api/favorites/', { credentials: 'include' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var grid = document.getElementById('fav-grid');
                grid.innerHTML = '';
                document.getElementById('fav-count').textContent =
                    data.count + ' saved crag' + (data.count === 1 ? '' : 's');
                if (!data.results.length) {
                    grid.innerHTML = '<div class="empty-state">' +
                        'You have no favorites yet.<br><br>' +
                        '<a href="/search/"><i class="fas fa-search"></i> Explore crags</a></div>';
                    return;
                }
                data.results.forEach(function (c) { grid.appendChild(buildCard(c)); });
                bindRemove();
            })
            .catch(function () {
                document.getElementById('fav-grid').innerHTML =
                    '<div class="empty-state">Failed to load favorites.</div>';
            });
    }

    function bindRemove() {
        document.querySelectorAll('.remove-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var id = btn.getAttribute('data-crag');
                fetch('/api/favorites/' + id + '/', {
                    method: 'DELETE', credentials: 'include',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }
                }).then(function () { loadFavorites(); });
            });
        });
    }

    loadFavorites();
</script>
{% endblock %}
