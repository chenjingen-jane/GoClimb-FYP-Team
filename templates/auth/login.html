{% extends 'base.html' %}

{% block content %}
<style>
    /* Login Card Styles */
    .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(15px);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 420px;
    }

    .login-card h3 {
        text-align: center;
        color: #2c3e50;
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 30px;
    }

    /* Input Group Styles */
    .input-group {
        position: relative;
        margin-bottom: 20px;
    }

    .input-group i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #7f8c8d;
        font-size: 18px;
    }

    .input-group input {
        width: 100%;
        padding: 15px 15px 15px 45px; /* Added left padding for the icon */
        border: 2px solid #e0e6ed;
        border-radius: 8px;
        font-size: 15px;
        transition: all 0.3s ease;
        outline: none;
    }

    /* Input Focus Effects - Updated to Blue */
    .input-group input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
    }

    .input-group input:focus + i {
        color: #3b82f6;
    }

    /* Login Button Styles - Updated to Blue Gradient */
    .login-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 10px;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 15px rgba(59, 130, 246, 0.3);
    }

    /* Helper Links */
    .form-footer {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
        color: #7f8c8d;
    }

    .form-footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s;
    }

    .form-footer a:hover {
        color: #1d4ed8;
        text-decoration: underline;
    }
</style>

<div class="login-card">
    <h3>Welcome Back</h3>

    <form id="login-form" method="POST">
        <!-- {% csrf_token %} ensures the csrftoken cookie is set for the fetch call -->
        {% csrf_token %}

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <div class="form-footer">
        <p>Don't have an account? <a href="/register/">Create Account</a></p>
        <p style="margin-top: 10px;"><a href="/password-reset/" style="font-weight: normal;">Forgot Password?</a></p>
    </div>
</div>

<script>
    function getCookie(name) {
        const m = document.cookie.split('; ').find(c => c.startsWith(name + '='));
        return m ? decodeURIComponent(m.split('=')[1]) : '';
    }
    let originalLabel = null;
    document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const form = e.target;
        const btn = form.querySelector('button[type="submit"]');
        // Checking a password takes a few seconds on the server: send ONE login only and show it's working.
        if (form.dataset.busy === '1') return;
        form.dataset.busy = '1';
        originalLabel = originalLabel || btn.innerHTML;      // remember the real text once
        const label = originalLabel;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';
        const unlock = () => { form.dataset.busy = ''; btn.disabled = false; btn.innerHTML = label; };
        try {
            const csrftoken = getCookie('csrftoken');
            const res = await fetch('/api/auth/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
                credentials: 'include',
                body: JSON.stringify({ username: form.email.value, password: form.password.value })
            });
            const result = await res.json();
            if (res.ok && result.success) {
                // A protected page (for example scheduling) sends guests here with ?next=.
                // Only allow local paths ("/x", not "//other-site") to prevent open redirects.
                const next = new URLSearchParams(window.location.search).get('next');
                const safe = next && next.startsWith('/') && !next.startsWith('//') && !next.startsWith('/\\');
                btn.innerHTML = '<i class="fas fa-check"></i> Signed in';
                window.location.href = safe ? next : '/search/';
            } else {
                unlock();
                alert(result.error || 'Login failed, please try again');
            }
        } catch (err) {
            unlock();
            alert('Could not reach the server. Please check your connection and try again.');
        }
    });
</script>
{% endblock %}
